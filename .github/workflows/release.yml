# Builds the downloadable apps. Push a tag like v1.0.0 to publish a GitHub release with
# MusicMatch-Windows.zip and MusicMatch-macOS.zip attached; "Run workflow" on the Actions
# tab builds them as downloadable artifacts without making a release.
name: Build apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: MusicMatch-Windows.zip
          - os: macos-latest  # Apple Silicon
            asset: MusicMatch-macOS.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r packaging/requirements-build.txt

      - name: Test
        run: python -m unittest discover -s tests

      - name: Build
        run: pyinstaller packaging/MusicMatch.spec --noconfirm

      - name: Sign, notarize, and zip (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_P12: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          MAC_P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          MAC_ASSET: ${{ matrix.asset }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          export SIGNING_TEMP
          SIGNING_TEMP="$(mktemp -d "$RUNNER_TEMP/musicmatch-signing.XXXXXX")"
          export KEYCHAIN_PATH="$SIGNING_TEMP/signing.keychain-db"
          cleanup() {
            security delete-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1 || true
            rm -rf "$SIGNING_TEMP"
          }
          trap cleanup EXIT
          KEYCHAIN_PASSWORD="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          required = ("MAC_P12", "MAC_P12_PASSWORD", "APPLE_API_KEY_BASE64",
                      "APPLE_API_KEY_ID", "APPLE_API_ISSUER")
          if any(not os.environ.get(name) for name in required):
              raise SystemExit("Required macOS signing secrets are missing.")
          temporary = Path(os.environ["SIGNING_TEMP"])
          try:
              (temporary / "certificate.p12").write_bytes(base64.b64decode(os.environ["MAC_P12"]))
              (temporary / "AuthKey.p8").write_bytes(base64.b64decode(os.environ["APPLE_API_KEY_BASE64"]))
          except Exception:
              raise SystemExit("Could not decode macOS signing credentials.") from None
          PY
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null 2>&1
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH" >/dev/null 2>&1
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null 2>&1
          security import "$SIGNING_TEMP/certificate.p12" -P "$MAC_P12_PASSWORD" \
            -k "$KEYCHAIN_PATH" -T /usr/bin/codesign >/dev/null 2>&1
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null 2>&1
          unset KEYCHAIN_PASSWORD MAC_P12 MAC_P12_PASSWORD APPLE_API_KEY_BASE64
          python - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          keychain = os.environ["KEYCHAIN_PATH"]
          identities = subprocess.check_output(
              ["security", "find-identity", "-v", "-p", "codesigning", keychain],
              text=True, stderr=subprocess.DEVNULL,
          )
          matches = re.findall(r'\b([0-9A-F]{40}) "Developer ID Application:[^"]+"', identities)
          if len(matches) != 1:
              raise SystemExit("Expected exactly one valid Developer ID Application identity.")
          app = Path("dist/MusicMatch.app")
          if not app.is_dir():
              raise SystemExit("MusicMatch.app is missing.")
          command = ["codesign", "--force", "--sign", matches[0], "--keychain", keychain,
                     "--options", "runtime", "--timestamp",
                     "--entitlements", "packaging/entitlements.mac.plist"]
          magic_numbers = {
              bytes.fromhex(value) for value in (
                  "feedface", "cefaedfe", "feedfacf", "cffaedfe",
                  "cafebabe", "bebafeca", "cafebabf", "bfbafeca",
              )
          }
          paths = sorted(app.rglob("*"), key=lambda path: (-len(path.parts), str(path)))
          binaries = []
          bundles = []
          for path in paths:
              if path.is_symlink():
                  continue
              if path.is_file():
                  with path.open("rb") as source:
                      if source.read(4) in magic_numbers:
                          binaries.append(path)
              elif path.is_dir() and path.suffix in (".framework", ".app", ".xpc", ".appex", ".bundle"):
                  bundles.append(path)
          try:
              for path in [*binaries, *bundles, app]:
                  subprocess.run([*command, str(path)], check=True,
                                 stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              subprocess.run(["codesign", "--verify", "--deep", "--strict", str(app)],
                             check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          except subprocess.CalledProcessError:
              raise SystemExit("macOS code signing or signature verification failed.") from None
          PY
          codesign -dv --verbose=4 dist/MusicMatch.app
          ditto -c -k --keepParent dist/MusicMatch.app "$SIGNING_TEMP/submission.zip"
          xcrun notarytool submit "$SIGNING_TEMP/submission.zip" --wait \
            --key "$SIGNING_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" --output-format json \
            >"$SIGNING_TEMP/notarization.json" 2>"$SIGNING_TEMP/notarization.stderr"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads((Path(os.environ["SIGNING_TEMP"]) / "notarization.json").read_text())
          if result.get("status") != "Accepted":
              raise SystemExit("Apple notarization was not accepted; refusing to publish.")
          PY
          xcrun stapler staple dist/MusicMatch.app >/dev/null 2>&1
          xcrun stapler validate dist/MusicMatch.app >/dev/null 2>&1
          spctl --assess --type execute --verbose=4 dist/MusicMatch.app
          ditto -c -k --keepParent dist/MusicMatch.app "$MAC_ASSET"

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/MusicMatch -DestinationPath ${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
          generate_release_notes: true
