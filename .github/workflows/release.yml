# Builds the downloadable apps. Push a tag like v1.0.0 to publish a GitHub release with
# MusicMatch-Windows.zip and MusicMatch-macOS.zip attached; "Run workflow" on the Actions
# tab builds them as downloadable artifacts without making a release.
name: Build apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: MusicMatch-Windows.zip
          - os: macos-latest  # Apple Silicon
            asset: MusicMatch-macOS.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r packaging/requirements-build.txt

      - name: Test
        run: python -m unittest discover -s tests

      - name: Build
        run: pyinstaller packaging/MusicMatch.spec --noconfirm

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/MusicMatch -DestinationPath ${{ matrix.asset }}

      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/MusicMatch.app ${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
          generate_release_notes: true
